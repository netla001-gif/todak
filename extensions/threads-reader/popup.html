<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>토닥 · Threads 나들이 읽기</title><link rel="stylesheet" href="popup.css"></head><body>
<header><strong>토닥</strong><h1>Threads 나들이 읽기</h1></header>
<form id="search"><label for="query">지역·장소·검색어</label><input id="query" value="하남 아이랑" minlength="2" maxlength="60" required><button type="submit">Threads 검색 화면 열기</button></form>
<p class="hint">검색 결과가 뜨면 이 도구를 다시 눌러 주세요. 화면을 더 내려 글을 불러온 뒤 ‘다시 읽기’를 누를 수도 있어요.</p>

<script type="module" src="popup.mjs"></script></body></html>
